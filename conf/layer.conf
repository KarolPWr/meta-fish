# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-fish"
BBFILE_PATTERN_meta-fish = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-fish = "6"

# meta-fish jest warstwa wylacznie konfiguracyjna - dostarcza distro i fragmenty,
# nie ma zadnej receptury. Bez tego bitbake przy kazdym parsowaniu ostrzega:
#   "No bb files in default matched BBFILE_PATTERN_meta-fish"
BBFILE_PATTERN_IGNORE_EMPTY_meta-fish = "1"

LAYERDEPENDS_meta-fish = "core"
LAYERSERIES_COMPAT_meta-fish = "wrynose"
