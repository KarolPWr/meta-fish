DISTRO = "sunfish"
DISTRO_NAME = "sunfish"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "sunfish"

LOCALCONF_VERSION = "2"

# Override these in SUNFISH based distros
#
# Uwaga (migracja scarthgap -> wrynose): do 6.0 doklejalo sie tutaj recznie
# "opengl ptest multiarch wayland vulkan". Od 6.0 te feature'y sa domyslne
# (DISTRO_FEATURES_DEFAULTS w meta/conf/bitbake.conf) i sa dodawane automatycznie.
# Zeby z czegos zrezygnowac, uzyj DISTRO_FEATURES_OPTED_OUT, nie usuwaj z listy ponizej.
#
# Zostaje wiec tylko to, czym sunfish naprawde rozni sie od ustawien domyslnych:
#
#   pam - wymagany przez westona, gdy init managerem jest systemd
#         (meta/recipes-graphics/wayland/required-distro-features.inc:
#          REQUIRED_DISTRO_FEATURES = "wayland opengl <pam jesli systemd>").
#         W wersji scarthgap kursu dokladano go recznie w local.conf (modul M6).
#         Bez niego weston i weston-init sa POMIJANE, a razem z nimi cale GUI -
#         i to bez zadnego bledu, dopoki nie sprobujesz zbudowac obrazu z weston.
SUNFISH_DEFAULT_DISTRO_FEATURES = "pam"
SUNFISH_DEFAULT_EXTRA_RDEPENDS = "packagegroup-core-boot packagegroup-rpi-console-games"
SUNFISH_DEFAULT_EXTRA_RRECOMMENDS = "kernel-module-af-packet"

LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

DISTRO_FEATURES ?= "${SUNFISH_DEFAULT_DISTRO_FEATURES}"

DISTRO_EXTRA_RDEPENDS += "${SUNFISH_DEFAULT_EXTRA_RDEPENDS}"
DISTRO_EXTRA_RRECOMMENDS += "${SUNFISH_DEFAULT_EXTRA_RRECOMMENDS}"

BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"

SUNFISH_INIT_MANAGER = "systemd"
INIT_MANAGER ?= "${SUNFISH_INIT_MANAGER}"

# We need debug symbols so that SPDX license manifests for the kernel work
KERNEL_EXTRA_FEATURES:append = " features/debug/debug-kernel.scc"
