BB_CONF_FRAGMENT_SUMMARY = "Kiosk GUI: Weston + cog + aplikacja webowa sterujaca GPIO."
BB_CONF_FRAGMENT_DESCRIPTION = "Dokłada kompozytor Weston oraz packagegroup-gui z warstwy \
meta-gui, dzieki czemu po starcie systemu automatycznie podnosi sie przegladarka cog \
na pelnym ekranie, wyswietlajaca strone serwowana lokalnie przez apache2. \
Fragment jest opcjonalny - obrazy konsolowe (prod-image) nie powinny go wlaczac. \
"

# Z poziomu konfiguracji dokladamy image features przez EXTRA_IMAGE_FEATURES.
# IMAGE_FEATURES ustawia sie w recepcie obrazu; image.bbclass dokleja do niego
# zawartosc EXTRA_IMAGE_FEATURES.
#
# Feature "weston" rozwija sie na packagegroup-core-weston, czyli
# weston + weston-init + weston-examples + wayland-utils. Kluczowy jest weston-init:
# to jego weston.ini modyfikuje bbappend z meta-gui, dopisujac sekcje [autolaunch].
EXTRA_IMAGE_FEATURES:append = " weston"

# CORE_IMAGE_EXTRA_INSTALL to konfiguracyjny odpowiednik IMAGE_INSTALL - dziala
# dla wszystkiego, co dziedziczy core-image (u nas: wszystkie obrazy).
CORE_IMAGE_EXTRA_INSTALL += "packagegroup-gui"

# Bez ani jednego skompilowanego schematu GSettings w obrazie at-spi-bus-launcher
# przerywa z SIGABRT ("Cannot get the default GSettingsSchemaSource"). Serwis
# org.a11y.Bus zostaje wtedy activatable, ale nigdy nie odpowiada, a WebKit 2.52 -
# ktory porzucil ATK i rozmawia z AT-SPI wprost po D-Bus - czeka na kazdym starcie
# cog 25 s na domyslny timeout D-Bus. Efekt: kiosk wstaje po ~43 s zamiast ~12 s,
# a przez ten czas widac pulpit desktop-shell weston-a. Szczegoly: dziennik K5.5.
#
# at-spi2-core jest w obrazie na twardo, przez RDEPENDS:wpewebkit, i nie da sie go
# wyrzucic bez przebudowy wpewebkit - wiec dokladamy brakujace schematy.
CORE_IMAGE_EXTRA_INSTALL += "gsettings-desktop-schemas"
